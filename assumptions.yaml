# ==============================================================================
# assumptions.yaml
# Complete parameter dictionary for synthetic teleoperation operations simulation.
# Every planted effect is explicitly defined with its value, rationale, and note.
# ==============================================================================

meta:
  notice: "All parameters are simulated model assumptions, not real company data."

global:
  random_seed:
    value: 42
    rationale: "Ensures fully reproducible dataset generation across runs"
    note: "assumption, not real data"
  reference_date:
    value: "2026-11-01"
    rationale: "Simulated evaluation cut-off date for tenure and reporting calculations"
    note: "assumption, not real data"
  simulation_days:
    value: 90
    rationale: "Standard quarterly operational telemetry window (90 days)"
    note: "assumption, not real data"

